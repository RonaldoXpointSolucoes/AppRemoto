services:
  hbbs:
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbs -r ${RUSTDESK_RELAY_HOST:?RUSTDESK_RELAY_HOST is required}:21117
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
    volumes:
      - hbbs_data:/root
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr
    ports:
      - "21117:21117/tcp"
    volumes:
      - hbbr_data:/root
    restart: unless-stopped

volumes:
  hbbs_data:
  hbbr_data:
